services:
  mysqldb:
    image: mysql:8.0.42
    container_name: mysql
    restart: always
    volumes:
      - my-db:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: laboratorio
      MYSQL_USER: laboratorio
      MYSQL_PASSWORD: 1234

volumes:
  my-db: